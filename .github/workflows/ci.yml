name: ML Model CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run training and API tests
        run: python -m pytest tests/test_workflow.py -q --junitxml=test-results.xml

      - name: Train model for the Python 3.12 serving image
        if: matrix.python-version == '3.12'
        run: python train.py

      - name: Upload serving artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: serving-model-python-3.12
          path: |
            artifacts/model.joblib
            artifacts/metadata.json
            artifacts/metrics.json
            artifacts/model_comparison.csv
          if-no-files-found: error
          retention-days: 7

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 7

  docker-smoke:
    name: Docker model-serving check
    needs: python-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download trained serving model
        uses: actions/download-artifact@v4
        with:
          name: serving-model-python-3.12
          path: artifacts

      - name: Validate Compose configuration
        run: docker compose --profile checks config --quiet

      - name: Build and start model API
        run: docker compose up --build --detach --wait --wait-timeout 120 model-api

      - name: Verify predictions from another container
        run: docker compose --profile checks run --rm smoke-check

      - name: Show container status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color model-api

      - name: Stop containers
        if: always()
        run: docker compose --profile checks down --remove-orphans